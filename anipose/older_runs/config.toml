
project = 'hand-demo'

#  model_folder = 'C:\Users\Rupp\Downloads\tuthilllab\anipose\hand-demo-dlc-TuthillLab-2019-08-05'
model_folder = '/home/spice-lab/Desktop/hand-demo-dlc-TuthillLab-2019-08-05'

nesting = 1
# video_extension = 'MOV'
video_extension = 'mp4'

[calibration]
# checkerboard / charuco / aruco
board_type = "charuco"

# width and height of grid
# board_size = [10, 7]
board_size = [10, 8]

# number of bits in the markers, if aruco/charuco
board_marker_bits = 4

# number of markers in dictionary, if aruco/charuco
board_marker_dict_number = 50

# length of marker side
# board_marker_length = 18.75 # mm
board_marker_length = 16.00

# If aruco, length of marker separation
# board_marker_separation_length = 1 # mm

# If charuco or checkerboard, square side length
# board_square_side_length = 25 # mm
board_square_side_length = 22

animal_calibration = false

# fisheye = true
fisheye = false

[labeling]
scheme = [
   # ["base", "MCP1", "PIP1","tip1"],
   ["base", "MCP1", "PIP1", "DIP1", "tip1"],
   ["base", "MCP2", "PIP2", "DIP2", "tip2"],
   ["base", "MCP3", "PIP3", "DIP3", "tip3"],
   ["base", "MCP4", "PIP4", "DIP4", "tip4"],
   ["base", "MCP5", "PIP5", "DIP5", "tip5"]
 ]
 


[triangulation]
triangulate = true
# cam_regex = '-cam([A-Z])'
# cam_regex = '-cam0([1-4])'
# cam_align = "A"
# cam_regex = '^(0[1-4])$'
cam_regex = '-(cam0[1-4])'
cam_align = 'cam01'
ransac = false
# optim = true
optim = false
constraints = [
   # ["base", "MCP1"], ["MCP1", "PIP1"], ["PIP1", "tip1"],
   ["base", "MCP1"], ["MCP1", "PIP1"], ["PIP1", "DIP1"], ["DIP1", "tip1"],
   ["base", "MCP2"], ["MCP2", "PIP2"], ["PIP2", "DIP2"], ["DIP2", "tip2"],
   ["base", "MCP3"], ["MCP3", "PIP3"], ["PIP3", "DIP3"], ["DIP3", "tip3"],
   ["base", "MCP4"], ["MCP4", "PIP4"], ["PIP4", "DIP4"], ["DIP4", "tip4"],
   ["base", "MCP5"], ["MCP5", "PIP5"], ["PIP5", "DIP5"], ["DIP5", "tip5"]
]

scale_smooth = 25
scale_length = 10
scale_length_weak = 2
reproj_error_threshold = 3
score_threshold = 0.6
n_deriv_smooth = 2

[angles]
index1 = ["MCP2", "PIP2", "DIP2"]
index1_flex = ["flex", "MCP2", "PIP2", "DIP2"]
index1_axis = ["axis", "MCP2", "PIP2", "DIP2"]
index1_crossaxis = ["cross-axis", "MCP2", "PIP2", "DIP2"]
index2 = ["PIP2", "DIP2", "tip2"]
index2_flex = ["flex", "PIP2", "DIP2", "tip2"]
index2_axis = ["axis", "PIP2", "DIP2", "tip2"]
index2_crossaxis = ["cross-axis", "PIP2", "DIP2", "tip2"]

